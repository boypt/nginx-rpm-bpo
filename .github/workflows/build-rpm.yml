name: Build RPMs and Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - tag: el7
            arch: x86_64
            artifact: rpm-el7-x86_64
          - tag: el6
            arch: x86_64
            artifact: rpm-el6-x86_64
          - tag: el5
            m32: "0"
            arch: x86_64
            artifact: rpm-el5-x86_64
          - tag: el5
            m32: "1"
            arch: i686
            artifact: rpm-el5-i686
          - tag: aarch64_el7
            arch: aarch64
            artifact: rpm-el7-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run pullsrc.sh
        run: ./pullsrc.sh

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.tag }} (M32=${{ matrix.m32 }})
        run: |
          mkdir -p output
          chmod 777 output
          docker run --rm \
            -v $(pwd):/data \
            -e "M32=${{ matrix.m32 }}" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: output/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect RPM files
        run: |
          mkdir -p release-assets
          find artifacts -name '*.rpm' -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -la release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.rpm
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}